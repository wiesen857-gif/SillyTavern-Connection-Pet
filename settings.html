<div id="connection-pet-settings" class="connection-pet-settings inline-drawer">
  <div class="inline-drawer-toggle inline-drawer-header">
    <b><i class="fa-solid fa-sliders"></i> 连接桌宠</b>
    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
  </div>
  <div class="inline-drawer-content">
    <div class="cp-intro">仅切换 Chat Completion → Custom（OpenAI-compatible）。API 配置与提示词预设互不关联。</div>
    <label class="checkbox_label"><input id="cp-enabled" type="checkbox"><span>显示桌宠</span></label>

    <section class="cp-section">
      <div class="cp-heading"><span>API 配置</span><button id="cp-new-profile" class="menu_button">新建</button></div>
      <select id="cp-profile-select" class="text_pole"></select>
      <p id="cp-profile-source" class="cp-hint"></p>
      <div class="cp-grid">
        <label>配置名称<input id="cp-profile-name" class="text_pole" autocomplete="off"></label>
        <label>模型 ID
          <div class="cp-field-action">
            <input id="cp-profile-model" class="text_pole" list="cp-model-options" autocomplete="off">
            <datalist id="cp-model-options"></datalist>
            <button id="cp-fetch-models" type="button" class="menu_button">获取模型</button>
          </div>
        </label>
        <label class="cp-wide">API 地址<input id="cp-profile-url" class="text_pole" placeholder="http://127.0.0.1:1234/v1" autocomplete="off"></label>
        <label>已有 Secret<select id="cp-profile-secret" class="text_pole"></select></label>
        <label>新 API Key（可选）<input id="cp-profile-key" class="text_pole" type="password" autocomplete="new-password" placeholder="仅写入酒馆原生 Secrets"></label>
      </div>
      <div class="cp-actions">
        <button id="cp-save-profile" class="menu_button">保存配置</button>
        <button id="cp-copy-profile" class="menu_button">复制</button>
        <button id="cp-delete-profile" class="menu_button cp-danger">删除</button>
      </div>
      <p class="cp-hint">删除配置不会删除酒馆 Secrets 中的密钥。</p>
    </section>

    <section class="cp-section">
      <div class="cp-heading"><span>待开启条目</span><button id="cp-refresh-presets" class="menu_button" title="刷新">↻</button></div>
      <select id="cp-preset-select" class="text_pole"></select>
      <div id="cp-prompt-list" class="cp-prompt-list"></div>
      <p class="cp-hint">勾选表示加入桌宠可操作列表，不会立即开启条目。</p>
    </section>

    <div class="cp-actions"><button id="cp-reset-position" class="menu_button">重置桌宠位置</button></div>
    <div id="cp-settings-status" class="cp-status" role="status"></div>
  </div>
</div>
