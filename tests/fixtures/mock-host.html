<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连接桌宠视觉验收</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    :root { --SmartThemeBodyColor:#eadfe6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:#eadfe6; font:16px system-ui,sans-serif; background:linear-gradient(145deg,#777082,#4e4656 50%,#2e2934); }
    .mock-shell { width:min(760px,calc(100% - 32px)); margin:28px auto; padding:18px; border-radius:18px; background:rgba(18,16,23,.88); box-shadow:0 25px 70px #211b27; }
    .mock-shell h1 { margin:0 0 16px; font-size:24px; }
    .inline-drawer-header { display:flex; justify-content:space-between; padding:12px; border-radius:10px; background:#292335; cursor:pointer; }
    .inline-drawer-content { display:none; }
    .inline-drawer.open .inline-drawer-content { display:block; }
    .text_pole, select, input { width:100%; min-height:36px; padding:7px 9px; border:1px solid #675a6d; border-radius:8px; color:#f4eaf0; background:#25202b; }
    .menu_button { min-height:34px; padding:6px 10px; border:1px solid #776879; border-radius:8px; color:#f1e6ed; background:#38303f; cursor:pointer; }
    .checkbox_label { display:flex; gap:8px; align-items:center; }.checkbox_label input,.cp-prompt-row input{width:auto;min-height:auto}
  </style>
</head>
<body>
  <main class="mock-shell"><h1>扩展</h1><div id="extensions_settings"></div></main>
  <script>
    const preset = { settings:{}, prompts:[
      {id:'main',name:'主提示词',enabled:true,role:'system',content:''},
      {id:'cot',name:'思维链辅助',enabled:false,role:'system',content:''},
      {id:'style',name:'文风增强',enabled:true,role:'system',content:''}
    ], prompts_unused:[], extensions:{} };
    window.SillyTavern={getContext:()=>({onlineStatus:'Valid',extensionSettings:{connectionPet:{version:2,enabled:true,activeProfileRef:{source:'local',id:'demo'},profiles:[{id:'demo',name:'本地创作',apiUrl:'http://127.0.0.1:1234/v1',model:'demo-model',secretId:'secret-1',note:''}],presetAllowlist:{'创作预设':[{promptId:'cot',lastKnownName:'思维链辅助'},{promptId:'style',lastKnownName:'文风增强'}]}},connectionManager:{profiles:[{id:'native-demo',name:'酒馆 Custom 示例',mode:'cc',api:'custom','api-url':'https://example.test/v1',model:'native-demo-model','secret-id':'',preset:'不得切换的预设'},{id:'ignored',name:'独立供应商示例',mode:'cc',api:'openrouter','api-url':'https://openrouter.ai/api/v1',model:'ignored'}]}},saveSettingsDebounced(){},executeSlashCommandsWithOptions:async()=>{}})};
    window.TavernHelper={getPresetNames:()=>['创作预设','简洁预设'],getLoadedPresetName:()=> '创作预设',getPreset:()=>structuredClone(preset),loadPreset:()=>true,replacePreset:async()=>{}};
    window.toastr={error:console.error};
    document.addEventListener('click',e=>{const head=e.target.closest('.inline-drawer-header');if(head)head.closest('.inline-drawer').classList.toggle('open')});
  </script>
  <script type="module" src="/index.js"></script>
</body>
</html>
